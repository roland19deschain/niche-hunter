name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/niche-hunter/requirements-pdf.txt pypdf
      - run: python scripts/release.py check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py build --out dist
      - run: git diff --check
